name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  # The Codex release the end-to-end checks run against.
  CODEX_VERSION: "0.156.1"

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest -q

  sub2api-docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: docker build -f packaging/sub2api/Dockerfile -t excel-sub2api:test .
      - run: python tests/e2e/sub2api_smoke.py --image excel-sub2api:test
      - run: python tests/e2e/sub2api_smoke.py --image excel-sub2api:test --route excel
      - run: python tests/e2e/sub2api_smoke.py --image excel-sub2api:test --route codex-ws

  e2e-linux:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g @openai/codex@${{ env.CODEX_VERSION }}
      - run: python -m pip install -r requirements.txt
      - name: e2e (excel-codex.sh)
        run: python tests/e2e/run_e2e.py -- ./excel-codex.sh
      - name: e2e (excel-codex-restore.command puts Codex back on its own setup)
        run: python tests/e2e/restore_e2e.py ./excel-codex-restore.command
      - name: e2e (excel-codex.sh desktop)
        run: python tests/e2e/run_e2e.py --desktop -- ./excel-codex.sh
      - name: e2e (excel-codex.sh, pictures)
        run: python tests/e2e/run_e2e.py --images -- ./excel-codex.sh
      - name: e2e (excel-codex.sh desktop, pictures)
        run: python tests/e2e/run_e2e.py --desktop --images -- ./excel-codex.sh
      - name: e2e (excel-codex.sh, image tool)
        run: python tests/e2e/run_e2e.py --imagegen -- ./excel-codex.sh
      - name: e2e (excel-codex.sh desktop, image tool)
        run: python tests/e2e/run_e2e.py --desktop --imagegen -- ./excel-codex.sh
      - name: e2e (excel-codex.sh, Codex's sign-in)
        run: python tests/e2e/run_e2e.py --codex-login -- ./excel-codex.sh
      - name: e2e (excel-codex.sh desktop, Codex's sign-in refused)
        run: python tests/e2e/run_e2e.py --desktop --codex-login refused -- ./excel-codex.sh
      - name: e2e (excel-codex.sh, conversations shared with Codex's own sign-in)
        run: python tests/e2e/run_e2e.py --shared -- ./excel-codex.sh
      - name: e2e (excel-codex.sh desktop, conversations shared with Codex's own sign-in)
        run: python tests/e2e/run_e2e.py --desktop --shared -- ./excel-codex.sh
      - name: e2e (excel-codex.sh, the bridge's own conversations moved by threads migrate)
        run: python tests/e2e/run_e2e.py --migrate -- ./excel-codex.sh
      - name: e2e (excel-codex.sh desktop, the bridge's own conversations moved at start)
        run: python tests/e2e/run_e2e.py --migrate desktop -- ./excel-codex.sh
      - name: e2e (excel-codex.sh, a 1M conversation moved onto the same model's official version)
        run: python tests/e2e/run_e2e.py --migrate --model gpt-5.6-sol-1m-excel -- ./excel-codex.sh
      - name: e2e (excel-codex.sh, a relay's `OpenAI` conversations moved by threads migrate --from)
        run: python tests/e2e/run_e2e.py --migrate relay -- ./excel-codex.sh
      - name: e2e (excel-codex.sh, the shared rate limit waited out)
        run: python tests/e2e/run_e2e.py --rate-limited -- ./excel-codex.sh
      - name: e2e (excel-codex.sh, a rate limit longer than Codex waits for a silent stream)
        run: python tests/e2e/run_e2e.py --rate-limited long -- ./excel-codex.sh
      - name: e2e (excel-codex.sh desktop, the shared rate limit waited out)
        run: python tests/e2e/run_e2e.py --desktop --shared --rate-limited -- ./excel-codex.sh
      - name: e2e (excel-codex.sh, a network drop waited out)
        run: python tests/e2e/run_e2e.py --network-drop -- ./excel-codex.sh
      - name: e2e (excel-codex.sh desktop, a network drop waited out)
        run: python tests/e2e/run_e2e.py --desktop --shared --network-drop -- ./excel-codex.sh
      - name: e2e (excel-codex.sh, a helper agent given its task as text)
        run: python tests/e2e/run_e2e.py --subagent -- ./excel-codex.sh
      - name: e2e (excel-codex.sh desktop, a helper agent given its task as text)
        run: python tests/e2e/run_e2e.py --desktop --shared --subagent -- ./excel-codex.sh
      - name: e2e (excel-codex.sh, ultra effort delegating to helpers, backend asked for xhigh)
        run: python tests/e2e/run_e2e.py --ultra -- ./excel-codex.sh
      - name: e2e (excel-codex.sh desktop, ultra effort delegating to helpers, backend asked for xhigh)
        run: python tests/e2e/run_e2e.py --desktop --shared --ultra -- ./excel-codex.sh
      - name: e2e (excel-codex.sh, Responses Lite and code mode through a relay without the bridge's model entries)
        run: python tests/e2e/run_e2e.py --lite -- ./excel-codex.sh
      - name: e2e (excel-codex.sh, Responses Lite and code mode, gpt-6-sol)
        run: python tests/e2e/run_e2e.py --lite --model gpt-6-sol-excel -- ./excel-codex.sh
      - name: e2e (excel-codex.sh, an MCP tool found with tool_search, then called)
        run: python tests/e2e/run_e2e.py --tool-search -- ./excel-codex.sh
      - name: e2e (excel-codex.sh desktop, an MCP tool found with tool_search, then called)
        run: python tests/e2e/run_e2e.py --desktop --tool-search -- ./excel-codex.sh

      - name: Multi-channel research (source)
        run: python tests/e2e/channels_smoke.py -- ./excel-codex.sh
      - name: Build Linux package
        run: |
          python -m pip install pyinstaller
          python -m PyInstaller --noconfirm --clean --onedir --console --name excel-codex --paths src --collect-submodules uvicorn --hidden-import anyio._backends._asyncio --collect-submodules h2 packaging/entry.py
      - name: Multi-channel research (Linux binary)
        run: python tests/e2e/channels_smoke.py -- dist/excel-codex/excel-codex
      - name: Package Linux
        run: |
          version=$(python -c "import sys; sys.path.insert(0, 'src'); import excel_codex_bridge as m; print(m.__version__)")
          name="excel-codex-bridge-$version-linux-x64"
          mkdir -p "$name/docs"
          cp -R dist/excel-codex/. "$name/"
          cp codex-channels.sh README.md README.en.md LICENSE UPSTREAM-LICENSE "$name/"
          cp docs/channels.md docs/qq-group.jpg docs/sub2api.md docs/sub2api.en.md "$name/docs/"
          tar -czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          echo "PACKAGE=$name" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE }}
          path: |
            ${{ env.PACKAGE }}.tar.gz
            ${{ env.PACKAGE }}.tar.gz.sha256

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g @openai/codex@${{ env.CODEX_VERSION }}
      - run: python -m pip install -r requirements.txt pyinstaller

      # Windows has no zoneinfo of its own: bundle tzdata.
      - name: Build excel-codex.exe
        run: >-
          python -m PyInstaller --noconfirm --clean --onedir --console
          --name excel-codex --paths src
          --collect-submodules uvicorn --hidden-import anyio._backends._asyncio
          --collect-submodules h2
          --collect-all tzdata
          packaging/entry.py

      - name: SUB2API command (excel-codex.exe)
        run: dist/excel-codex/excel-codex.exe sub2api --help
      - name: Multi-channel research (Windows binary)
        run: python tests/e2e/channels_smoke.py -- dist/excel-codex/excel-codex.exe

      - name: e2e (excel-codex.exe)
        run: python tests/e2e/run_e2e.py -- dist/excel-codex/excel-codex.exe
      - name: e2e (excel-codex.exe, gpt-6-astra-excel)
        run: python tests/e2e/run_e2e.py --model gpt-6-astra-excel -- dist/excel-codex/excel-codex.exe
      - name: e2e (excel-codex.exe desktop)
        run: python tests/e2e/run_e2e.py --desktop -- dist/excel-codex/excel-codex.exe
      - name: e2e (excel-codex.exe, pictures)
        run: python tests/e2e/run_e2e.py --images -- dist/excel-codex/excel-codex.exe
      - name: e2e (excel-codex.exe desktop, pictures)
        run: python tests/e2e/run_e2e.py --desktop --images -- dist/excel-codex/excel-codex.exe
      - name: e2e (excel-codex.exe, image tool)
        run: python tests/e2e/run_e2e.py --imagegen -- dist/excel-codex/excel-codex.exe
      - name: e2e (excel-codex.exe desktop, image tool)
        run: python tests/e2e/run_e2e.py --desktop --imagegen -- dist/excel-codex/excel-codex.exe
      - name: e2e (excel-codex.exe, Codex's sign-in)
        run: python tests/e2e/run_e2e.py --codex-login -- dist/excel-codex/excel-codex.exe
      - name: e2e (excel-codex.exe desktop, Codex's sign-in refused)
        run: python tests/e2e/run_e2e.py --desktop --codex-login refused -- dist/excel-codex/excel-codex.exe
      - name: e2e (excel-codex.exe, conversations shared with Codex's own sign-in)
        run: python tests/e2e/run_e2e.py --shared -- dist/excel-codex/excel-codex.exe
      - name: e2e (excel-codex.exe desktop, conversations shared with Codex's own sign-in)
        run: python tests/e2e/run_e2e.py --desktop --shared -- dist/excel-codex/excel-codex.exe
      - name: e2e (excel-codex.exe, the bridge's own conversations moved by threads migrate)
        run: python tests/e2e/run_e2e.py --migrate -- dist/excel-codex/excel-codex.exe
      - name: e2e (excel-codex.exe desktop, the bridge's own conversations moved at start)
        run: python tests/e2e/run_e2e.py --migrate desktop -- dist/excel-codex/excel-codex.exe
      - name: e2e (excel-codex.exe, a 1M conversation moved onto the same model's official version)
        run: python tests/e2e/run_e2e.py --migrate --model gpt-5.6-sol-1m-excel -- dist/excel-codex/excel-codex.exe
      - name: e2e (excel-codex.exe, a relay's `OpenAI` conversations moved by threads migrate --from)
        run: python tests/e2e/run_e2e.py --migrate relay -- dist/excel-codex/excel-codex.exe
      - name: e2e (excel-codex.exe, the shared rate limit waited out)
        run: python tests/e2e/run_e2e.py --rate-limited -- dist/excel-codex/excel-codex.exe
      - name: e2e (excel-codex.exe, a rate limit longer than Codex waits for a silent stream)
        run: python tests/e2e/run_e2e.py --rate-limited long -- dist/excel-codex/excel-codex.exe
      - name: e2e (excel-codex.exe desktop, the shared rate limit waited out)
        run: python tests/e2e/run_e2e.py --desktop --shared --rate-limited -- dist/excel-codex/excel-codex.exe
      - name: e2e (excel-codex.exe, a network drop waited out)
        run: python tests/e2e/run_e2e.py --network-drop -- dist/excel-codex/excel-codex.exe
      - name: e2e (excel-codex.exe desktop, a network drop waited out)
        run: python tests/e2e/run_e2e.py --desktop --shared --network-drop -- dist/excel-codex/excel-codex.exe
      - name: e2e (excel-codex.exe, a helper agent given its task as text)
        run: python tests/e2e/run_e2e.py --subagent -- dist/excel-codex/excel-codex.exe
      - name: e2e (excel-codex.exe desktop, a helper agent given its task as text)
        run: python tests/e2e/run_e2e.py --desktop --shared --subagent -- dist/excel-codex/excel-codex.exe
      - name: e2e (excel-codex.exe desktop, ultra effort delegating to helpers, backend asked for xhigh)
        run: python tests/e2e/run_e2e.py --desktop --shared --ultra -- dist/excel-codex/excel-codex.exe
      - name: e2e (excel-codex.exe, Responses Lite and code mode through a relay without the bridge's model entries)
        run: python tests/e2e/run_e2e.py --lite -- dist/excel-codex/excel-codex.exe
      - name: e2e (excel-codex.exe, an MCP tool found with tool_search, then called)
        run: python tests/e2e/run_e2e.py --tool-search -- dist/excel-codex/excel-codex.exe
      - name: e2e (excel-codex.cmd)
        run: python tests/e2e/run_e2e.py -- excel-codex.cmd

      - name: Package
        shell: pwsh
        run: |
          $version = python -c "import sys; sys.path.insert(0, 'src'); import excel_codex_bridge as m; print(m.__version__)"
          $name = "excel-codex-bridge-$version-windows-x64"
          New-Item -ItemType Directory $name | Out-Null
          Copy-Item -Recurse dist/excel-codex/* $name/
          Copy-Item codex-channels.cmd, excel-codex-desktop.cmd, excel-codex-restore.cmd, README.md, README.en.md, LICENSE, UPSTREAM-LICENSE $name/
          New-Item -ItemType Directory $name/docs | Out-Null
          Copy-Item docs/channels.md, docs/qq-group.jpg, docs/sub2api.md, docs/sub2api.en.md $name/docs/
          Compress-Archive -Path $name -DestinationPath "$name.zip"
          $hash = (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.zip" | Out-File -Encoding ascii "$name.zip.sha256"
          "PACKAGE=$name" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: e2e (excel-codex-desktop.cmd installs a newer release by itself)
        run: python tests/e2e/update_e2e.py ${{ env.PACKAGE }}.zip
      - name: e2e (excel-codex-restore.cmd puts Codex back on its own setup)
        run: python tests/e2e/restore_e2e.py ${{ env.PACKAGE }}/excel-codex-restore.cmd

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE }}
          path: |
            ${{ env.PACKAGE }}.zip
            ${{ env.PACKAGE }}.zip.sha256

  macos:
    name: macos (${{ matrix.arch }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g @openai/codex@${{ env.CODEX_VERSION }}
      - run: python -m pip install -r requirements.txt pyinstaller

      - name: Build excel-codex
        run: >-
          python -m PyInstaller --noconfirm --clean --onedir --console
          --name excel-codex --paths src
          --collect-submodules uvicorn --hidden-import anyio._backends._asyncio
          --collect-submodules h2
          packaging/entry.py

      - name: SUB2API command (excel-codex)
        run: dist/excel-codex/excel-codex sub2api --help
      - name: Multi-channel research (macOS binary)
        run: python tests/e2e/channels_smoke.py -- dist/excel-codex/excel-codex

      - name: e2e (excel-codex)
        run: python tests/e2e/run_e2e.py -- dist/excel-codex/excel-codex
      - name: e2e (excel-codex desktop)
        run: python tests/e2e/run_e2e.py --desktop -- dist/excel-codex/excel-codex
      - name: e2e (excel-codex, pictures)
        run: python tests/e2e/run_e2e.py --images -- dist/excel-codex/excel-codex
      - name: e2e (excel-codex desktop, pictures)
        run: python tests/e2e/run_e2e.py --desktop --images -- dist/excel-codex/excel-codex
      - name: e2e (excel-codex, Codex's sign-in)
        run: python tests/e2e/run_e2e.py --codex-login -- dist/excel-codex/excel-codex
      - name: e2e (excel-codex desktop, Codex's sign-in refused)
        run: python tests/e2e/run_e2e.py --desktop --codex-login refused -- dist/excel-codex/excel-codex
      - name: e2e (excel-codex desktop, conversations shared with Codex's own sign-in)
        run: python tests/e2e/run_e2e.py --desktop --shared -- dist/excel-codex/excel-codex
      - name: e2e (excel-codex desktop, the shared rate limit waited out)
        run: python tests/e2e/run_e2e.py --desktop --shared --rate-limited -- dist/excel-codex/excel-codex
      - name: e2e (excel-codex, a rate limit longer than Codex waits for a silent stream)
        run: python tests/e2e/run_e2e.py --rate-limited long -- dist/excel-codex/excel-codex
      - name: e2e (excel-codex, a helper agent given its task as text)
        run: python tests/e2e/run_e2e.py --subagent -- dist/excel-codex/excel-codex
      - name: e2e (excel-codex, ultra effort delegating to helpers, backend asked for xhigh)
        run: python tests/e2e/run_e2e.py --ultra -- dist/excel-codex/excel-codex
      - name: e2e (excel-codex, Responses Lite and code mode through a relay without the bridge's model entries)
        run: python tests/e2e/run_e2e.py --lite -- dist/excel-codex/excel-codex
      - name: e2e (excel-codex, an MCP tool found with tool_search, then called)
        run: python tests/e2e/run_e2e.py --tool-search -- dist/excel-codex/excel-codex

      - name: Package
        run: |
          version=$(python -c "import sys; sys.path.insert(0, 'src'); import excel_codex_bridge as m; print(m.__version__)")
          name="excel-codex-bridge-$version-macos-${{ matrix.arch }}"
          mkdir -p "$name/docs"
          cp -R dist/excel-codex/. "$name/"
          cp codex-channels.sh codex-channels.command excel-codex-desktop.command excel-codex-restore.command README.md README.en.md LICENSE UPSTREAM-LICENSE "$name/"
          cp docs/channels.md docs/qq-group.jpg docs/sub2api.md docs/sub2api.en.md "$name/docs/"
          # The double-click launcher must find the packaged binary.
          CODEX_HOME="$RUNNER_TEMP/codex-home" "./$name/excel-codex-desktop.command" --off
          tar -czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
          echo "PACKAGE=$name" >> "$GITHUB_ENV"

      - name: e2e (excel-codex-restore.command puts Codex back on its own setup)
        run: python tests/e2e/restore_e2e.py "./${{ env.PACKAGE }}/excel-codex-restore.command"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE }}
          path: |
            ${{ env.PACKAGE }}.tar.gz
            ${{ env.PACKAGE }}.tar.gz.sha256

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [e2e-linux, windows, macos, sub2api-docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches the package version
        run: |
          version=$(python3 -c "import sys; sys.path.insert(0, 'src'); import excel_codex_bridge as m; print(m.__version__)")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match version $version" >&2
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" packages/*
          --title "Codex Channels $GITHUB_REF_NAME"
          --notes-file packaging/RELEASE_NOTES.md
