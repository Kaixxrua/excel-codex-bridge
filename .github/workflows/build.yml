name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  # The Codex release the end-to-end checks run against.
  CODEX_VERSION: "0.156.1"

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      # Pillow for the image host's re-encoding tests (the `host` extra).
      - run: python -m pip install -r requirements.txt pytest Pillow
      - run: python -m pytest -q

  e2e-linux:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g @openai/codex@${{ env.CODEX_VERSION }}
      - run: python -m pip install -r requirements.txt
      - name: e2e (excel-codex.sh)
        run: python tests/e2e/run_e2e.py -- ./excel-codex.sh
      - name: e2e (excel-codex.sh desktop)
        run: python tests/e2e/run_e2e.py --desktop -- ./excel-codex.sh
      - name: e2e (excel-codex.sh, pictures)
        run: python tests/e2e/run_e2e.py --images -- ./excel-codex.sh
      - name: e2e (excel-codex.sh desktop, pictures)
        run: python tests/e2e/run_e2e.py --desktop --images -- ./excel-codex.sh
      - name: e2e (excel-codex.sh, pictures through an image host)
        run: python tests/e2e/run_e2e.py --images remote -- ./excel-codex.sh
      - name: e2e (excel-codex.sh, pictures through the relay)
        run: python tests/e2e/run_e2e.py --images relay -- ./excel-codex.sh

  image-host-docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: One-click deploy (open relay, behind a proxy)
        run: deploy/image-host/deploy.sh img.example.com --relay --behind-proxy --port 18095
      - name: Upload, then fetch as a browser and as OpenAI
        run: |
          python3 -c "import base64,sys; sys.stdout.buffer.write(base64.b64decode('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8DwHwAFBQIAX8jx0gAAAABJRU5ErkJggg=='))" > dot.png
          url=$(curl -sf -X POST -H 'content-type: image/png' --data-binary @dot.png http://127.0.0.1:18095/upload \
            | python3 -c "import json,sys; print(json.load(sys.stdin)['url'])")
          path=${url#https://img.example.com}
          test "$(curl -s -o /dev/null -w '%{http_code}' -A 'Mozilla/5.0' "http://127.0.0.1:18095$path")" = 403
          test "$(curl -s -o /dev/null -w '%{http_code}' -A 'OpenAI File Downloader' "http://127.0.0.1:18095$path")" = 200
      - if: failure()
        run: docker compose -f deploy/image-host/docker-compose.yml logs

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g @openai/codex@${{ env.CODEX_VERSION }}
      - run: python -m pip install -r requirements.txt pyinstaller

      - name: Build excel-codex.exe
        run: >-
          python -m PyInstaller --noconfirm --clean --onedir --console
          --name excel-codex --paths src
          --collect-submodules uvicorn --hidden-import anyio._backends._asyncio
          packaging/entry.py

      - name: Add cloudflared
        run: |
          python packaging/cloudflared.py windows-amd64 dist/excel-codex
          dist/excel-codex/cloudflared.exe --version
          dist/excel-codex/excel-codex.exe image-host

      - name: e2e (excel-codex.exe)
        run: python tests/e2e/run_e2e.py -- dist/excel-codex/excel-codex.exe
      - name: e2e (excel-codex.exe, gpt-6-astra-excel)
        run: python tests/e2e/run_e2e.py --model gpt-6-astra-excel -- dist/excel-codex/excel-codex.exe
      - name: e2e (excel-codex.exe desktop)
        run: python tests/e2e/run_e2e.py --desktop -- dist/excel-codex/excel-codex.exe
      - name: e2e (excel-codex.exe, pictures)
        run: python tests/e2e/run_e2e.py --images -- dist/excel-codex/excel-codex.exe
      - name: e2e (excel-codex.exe desktop, pictures)
        run: python tests/e2e/run_e2e.py --desktop --images -- dist/excel-codex/excel-codex.exe
      - name: e2e (excel-codex.cmd)
        run: python tests/e2e/run_e2e.py -- excel-codex.cmd

      - name: Package
        shell: pwsh
        run: |
          $version = python -c "import sys; sys.path.insert(0, 'src'); import excel_codex_bridge as m; print(m.__version__)"
          $name = "excel-codex-bridge-$version-windows-x64"
          New-Item -ItemType Directory $name | Out-Null
          Copy-Item -Recurse dist/excel-codex/* $name/
          Copy-Item excel-codex-desktop.cmd, README.md, README.en.md, LICENSE, UPSTREAM-LICENSE $name/
          New-Item -ItemType Directory $name/docs | Out-Null
          Copy-Item docs/qq-group.jpg $name/docs/
          Compress-Archive -Path $name -DestinationPath "$name.zip"
          $hash = (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.zip" | Out-File -Encoding ascii "$name.zip.sha256"
          "PACKAGE=$name" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE }}
          path: |
            ${{ env.PACKAGE }}.zip
            ${{ env.PACKAGE }}.zip.sha256

  macos:
    name: macos (${{ matrix.arch }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            cloudflared: darwin-arm64
          - runner: macos-15-intel
            arch: x64
            cloudflared: darwin-amd64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g @openai/codex@${{ env.CODEX_VERSION }}
      - run: python -m pip install -r requirements.txt pyinstaller

      - name: Build excel-codex
        run: >-
          python -m PyInstaller --noconfirm --clean --onedir --console
          --name excel-codex --paths src
          --collect-submodules uvicorn --hidden-import anyio._backends._asyncio
          packaging/entry.py

      - name: Add cloudflared
        run: |
          python packaging/cloudflared.py ${{ matrix.cloudflared }} dist/excel-codex
          dist/excel-codex/cloudflared --version
          dist/excel-codex/excel-codex image-host

      - name: e2e (excel-codex)
        run: python tests/e2e/run_e2e.py -- dist/excel-codex/excel-codex
      - name: e2e (excel-codex desktop)
        run: python tests/e2e/run_e2e.py --desktop -- dist/excel-codex/excel-codex
      - name: e2e (excel-codex, pictures)
        run: python tests/e2e/run_e2e.py --images -- dist/excel-codex/excel-codex
      - name: e2e (excel-codex desktop, pictures)
        run: python tests/e2e/run_e2e.py --desktop --images -- dist/excel-codex/excel-codex

      - name: Package
        run: |
          version=$(python -c "import sys; sys.path.insert(0, 'src'); import excel_codex_bridge as m; print(m.__version__)")
          name="excel-codex-bridge-$version-macos-${{ matrix.arch }}"
          mkdir -p "$name/docs"
          cp -R dist/excel-codex/. "$name/"
          cp excel-codex-desktop.command README.md README.en.md LICENSE UPSTREAM-LICENSE "$name/"
          cp docs/qq-group.jpg "$name/docs/"
          # The double-click launcher must find the packaged binary.
          CODEX_HOME="$RUNNER_TEMP/codex-home" "./$name/excel-codex-desktop.command" --off
          tar -czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
          echo "PACKAGE=$name" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE }}
          path: |
            ${{ env.PACKAGE }}.tar.gz
            ${{ env.PACKAGE }}.tar.gz.sha256

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [e2e-linux, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches the package version
        run: |
          version=$(python3 -c "import sys; sys.path.insert(0, 'src'); import excel_codex_bridge as m; print(m.__version__)")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match version $version" >&2
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" packages/*
          --title "excel-codex-bridge $GITHUB_REF_NAME"
          --notes-file packaging/RELEASE_NOTES.md
